[package]
name = "hedg-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line interface for the HEDG protocol"
license = "MIT"

[[bin]]
name = "hedg"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
solana-sdk = "=1.17.0"
solana-client = "=1.17.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
